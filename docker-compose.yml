version: '3.8'

services:
  # MinIO: 로컬 S3 저장소 (영화/책 포스터 이미지)
  minio:
    image: quay.io/minio/minio
    container_name: minio_server
    ports:
      - "9000:9000" # 애플리케이션(서버)에서 S3 API로 통신할 때 쓰는 포트
      - "9001:9001" # 브라우저로 접속해서 눈으로 확인하는 웹 UI(Console) 포트
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}      # AWS S3의 Access Key 역할 (수정 가능)
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY} # AWS S3의 Secret Key 역할 (수정 가능, 8자 이상)
#    volumes:
#      - ./minio_data:/data            # 중요: 컨테이너가 꺼져도 이미지가 날아가지 않도록 로컬 폴더와 연결
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # MinIO 초기화: 버킷 생성 + 익명 읽기 허용 (한 번 실행하고 종료되는 일회성 컨테이너)
  # 버킷 정책은 볼륨에 저장되므로 docker compose down -v 를 하면 같이 지워진다.
  # 이 컨테이너가 up 할 때마다 다시 적용해주므로 수동으로 mc 명령을 칠 필요가 없다.
  # 익명 읽기가 필요한 이유: ImageService가 서명 없는 공개 URL을 만들기 때문에,
  # 버킷이 private이면 브라우저의 <img> 요청이 전부 403으로 떨어진다.
  minio-init:
    image: quay.io/minio/mc
    container_name: minio_init
    depends_on:
      - minio
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    # $$ 는 compose가 아니라 컨테이너 안의 셸이 변수를 풀도록 이스케이프한 것.
    # depends_on은 기동 순서만 보장하고 준비 완료를 기다려주지 않으므로 alias 성공까지 재시도한다.
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$STORAGE_ACCESS_KEY $$STORAGE_SECRET_KEY >/dev/null 2>&1; do
        echo 'MinIO 기다리는 중...'; sleep 1;
      done;
      mc mb --ignore-existing local/content-bucket;
      mc anonymous set download local/content-bucket;
      echo 'content-bucket 준비 완료 (익명 읽기 허용)';
      "
    restart: "no"

  # Qdrant: AI 벡터 검색용 (취향 분석 & 유사도 추천)
  qdrant:
    # 태그를 고정한다. latest로 두면 서버만 조용히 올라가서 build.gradle의
    # io.qdrant:client 버전과 어긋나고, 그 순간 point 조회가 빈 벡터를 돌려준다.
    # 클라이언트를 올릴 때 이 태그도 같이 올릴 것.
    image: qdrant/qdrant:v1.14.1
    container_name: qdrant_server
    ports:
      - "6333:6333"  # REST API 통신 및 웹 대시보드(UI) 접속용 포트
      - "6334:6334"  # gRPC 통신용 포트 (대용량 데이터를 더 빠르게 처리할 때 사용)
    # 이미지에 curl도 wget도 없다. bash의 /dev/tcp로 포트가 열렸는지만 본다.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 3s
      timeout: 3s
      retries: 20
#    volumes:
#      - ./qdrant_data:/qdrant/storage  # 데이터 영구 저장을 위한 로컬 폴더 연결
    restart: unless-stopped

  # PostgreSQL: 관계형 데이터의 심장 (Main DB + Log)
  postgres:
    build: ./postgres                 # 중요: 바로 위의 Dockerfile을 읽어서 빌드하라는 명령어입니다.
    # image: postgres:15     # 만약 Dockerfile을 안 쓴다면 이 줄의 주석을 풀고 build: . 을 지우면 됩니다.
    container_name: postgres_server
    ports:
      - "5432:5432"          # 로컬 5432 포트와 컨테이너 5432 포트 연결
    environment:
      POSTGRES_USER: ${POSTGRESQL_USERNAME}                    # DB 접속 아이디
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}     # DB 접속 비밀번호
      POSTGRES_DB: crates       # 처음 실행 시 자동으로 만들어질 데이터베이스 이름
    # pg_stat_statements: 쿼리별 총 실행 시간·호출 횟수·읽은 버퍼를 누적한다.
    # "p95가 4초"까지는 k6와 actuator가 알려주지만 "어느 쿼리 때문인지"는 이것만 답한다.
    #
    # shared_preload_libraries는 기동 시점에만 읽히는 값이라 런타임 변경이 안 된다.
    # 그래서 여기(command)에 둔다. 이미 떠 있는 컨테이너에 적용할 때는 데이터를 지키기 위해
    # 재생성 대신 ALTER SYSTEM SET + docker restart 를 쓴다(마운트가 익명 볼륨이라
    # 재생성 시 데이터 보존이 보장되지 않는다).
    #
    # track은 기본값(top, 최상위 문장만)을 쓴다. all은 함수 안에서 실행된 쿼리까지 세는데
    # 이 앱은 저장 프로시저를 쓰지 않아 결과가 같으면서 오버헤드만 는다.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    # depends_on은 컨테이너 시작만 보장한다. Flyway가 첫 쿼리를 던지는 시점에 DB가
    # 아직 준비되지 않았으면 앱이 그대로 죽는다. 그래서 준비 완료를 조건으로 건다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d crates"]
      interval: 3s
      timeout: 3s
      retries: 20
#    volumes:
#      - ./postgres_data:/var/lib/postgresql/data # 데이터 영구 보존을 위한 바인드 마운트
    restart: unless-stopped

  # Elasticsearch: 전문 텍스트 검색 (Nori 분석기 포함)
#  elasticsearch:
#    build: ./elasticsearch      # dockerFile 경로
#    container_name: elasticsearch
#    environment:
#      - node.name=elasticsearch
#      - discovery.type=single-node
#      - xpack.security.enabled=false  # 로컬 개발 편의를 위해 보안 해제 (실운영시 true 필수)
#      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # 메모리 제한 (안 걸면 RAM을 다 먹어버림), 로컬 메모리 최적화
#    ports:
#      - 9200:9200
#    volumes:
#      - es_data:/usr/share/elasticsearch/data
#    restart: unless-stopped

  # Kibana: Elasticsearch 데이터 시각화 도구
#  kibana:
#    image: docker.elastic.co/kibana/kibana:8.11.1
#    container_name: kibana
#    environment:
#      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
#    ports:
#      - 5601:5601
#    depends_on:
#      - elasticsearch
#    restart: unless-stopped

  # Redis: 추천 목록 캐싱 및 데이터 수화 (Hydration) 용
  redis:
    image: redis:latest
    container_name: redis_server
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Backend Server (Spring Boot)
  #
  # 부하테스트에서 재현 가능한 수치를 얻으려면 앱에 자원 상한이 있어야 한다. 네이티브로 띄우면
  # 앱이 10코어를 다 쓸 수도, 부하 생성기에 뺏길 수도 있어서 같은 코드를 두 번 재도 값이 다르다.
  #
  # 다만 상한을 걸어도 "운영에서 기대할 수치"가 되지는 않는다. 부하 생성기가 여전히 같은
  # 기계에 있어서다. 자세한 것은 docs/load-test-and-metrics.md 2장.
  backend:
    build: .
    container_name: backend_server
    ports:
      - "8080:8080"
    env_file:
      - crates_server.env
    environment:
      # 시작 벡터의 일일 갱신 기준을 한국 시간 자정으로 맞춘다.
      - TZ=Asia/Seoul
      # 컨테이너 안에서 localhost는 자기 자신이다. 도커 네트워크의 서비스 이름으로 바꾼다.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/crates
      - SPRING_DATA_REDIS_HOST=redis
      - AI_VECTORSTORE_QDRANT_HOST=qdrant
      - STORAGE_ENDPOINT=http://minio:9000
      # STORAGE_BUCKET_URL은 덮지 않는다. 이건 서버가 접속하는 주소가 아니라
      # 브라우저에게 내려주는 이미지 URL이라, minio:9000으로 바꾸면 프론트에서 전부 깨진다.
      #
      # AI_SERVER_BASE_URL도 그대로 둔다. Tailscale IP라 컨테이너에서 닿지 않을 수 있는데,
      # 지금은 ai.server.stub.enabled=true라 호출 자체가 없다. 스텁을 끄면 그때 확인할 것.
    depends_on:
      # 준비 완료까지 기다린다. 단순 depends_on은 컨테이너 시작만 보장해서,
      # Flyway가 첫 쿼리를 던질 때 DB가 아직 안 떠 있으면 앱이 그대로 죽는다.
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # 버킷이 없으면 시딩 중 이미지 업로드가 전부 실패한다.
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 3g
    # 자동 재시작을 걸지 않는다. 마이그레이션이 실패하면 4분짜리 시딩을 무한 반복하게 된다.
    # 개발 중에는 실패를 보고 고치는 편이 낫다.
    restart: "no"

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
#  es_data:
