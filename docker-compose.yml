version: '3.8'

services:
  # MinIO: 로컬 S3 저장소 (영화/책 포스터 이미지)
  minio:
    image: quay.io/minio/minio
    container_name: minio_server
    ports:
      - "9000:9000" # 애플리케이션(서버)에서 S3 API로 통신할 때 쓰는 포트
      - "9001:9001" # 브라우저로 접속해서 눈으로 확인하는 웹 UI(Console) 포트
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}      # AWS S3의 Access Key 역할 (수정 가능)
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY} # AWS S3의 Secret Key 역할 (수정 가능, 8자 이상)
#    volumes:
#      - ./minio_data:/data            # 중요: 컨테이너가 꺼져도 이미지가 날아가지 않도록 로컬 폴더와 연결
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # MinIO 초기화: 버킷 생성 + 익명 읽기 허용 (한 번 실행하고 종료되는 일회성 컨테이너)
  # 버킷 정책은 볼륨에 저장되므로 docker compose down -v 를 하면 같이 지워진다.
  # 이 컨테이너가 up 할 때마다 다시 적용해주므로 수동으로 mc 명령을 칠 필요가 없다.
  # 익명 읽기가 필요한 이유: ImageService가 서명 없는 공개 URL을 만들기 때문에,
  # 버킷이 private이면 브라우저의 <img> 요청이 전부 403으로 떨어진다.
  minio-init:
    image: quay.io/minio/mc
    container_name: minio_init
    depends_on:
      - minio
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    # $$ 는 compose가 아니라 컨테이너 안의 셸이 변수를 풀도록 이스케이프한 것.
    # depends_on은 기동 순서만 보장하고 준비 완료를 기다려주지 않으므로 alias 성공까지 재시도한다.
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$STORAGE_ACCESS_KEY $$STORAGE_SECRET_KEY >/dev/null 2>&1; do
        echo 'MinIO 기다리는 중...'; sleep 1;
      done;
      mc mb --ignore-existing local/content-bucket;
      mc anonymous set download local/content-bucket;
      echo 'content-bucket 준비 완료 (익명 읽기 허용)';
      "
    restart: "no"

  # Qdrant: AI 벡터 검색용 (취향 분석 & 유사도 추천)
  qdrant:
    # 태그를 고정한다. latest로 두면 서버만 조용히 올라가서 build.gradle의
    # io.qdrant:client 버전과 어긋나고, 그 순간 point 조회가 빈 벡터를 돌려준다.
    # 클라이언트를 올릴 때 이 태그도 같이 올릴 것.
    image: qdrant/qdrant:v1.14.1
    container_name: qdrant_server
    ports:
      - "6333:6333"  # REST API 통신 및 웹 대시보드(UI) 접속용 포트
      - "6334:6334"  # gRPC 통신용 포트 (대용량 데이터를 더 빠르게 처리할 때 사용)
#    volumes:
#      - ./qdrant_data:/qdrant/storage  # 데이터 영구 저장을 위한 로컬 폴더 연결
    restart: unless-stopped

  # PostgreSQL: 관계형 데이터의 심장 (Main DB + Log)
  postgres:
    build: ./postgres                 # 중요: 바로 위의 Dockerfile을 읽어서 빌드하라는 명령어입니다.
    # image: postgres:15     # 만약 Dockerfile을 안 쓴다면 이 줄의 주석을 풀고 build: . 을 지우면 됩니다.
    container_name: postgres_server
    ports:
      - "5432:5432"          # 로컬 5432 포트와 컨테이너 5432 포트 연결
    environment:
      POSTGRES_USER: ${POSTGRESQL_USERNAME}                    # DB 접속 아이디
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}     # DB 접속 비밀번호
      POSTGRES_DB: crates       # 처음 실행 시 자동으로 만들어질 데이터베이스 이름
    # pg_stat_statements: 쿼리별 총 실행 시간·호출 횟수·읽은 버퍼를 누적한다.
    # "p95가 4초"까지는 k6와 actuator가 알려주지만 "어느 쿼리 때문인지"는 이것만 답한다.
    #
    # shared_preload_libraries는 기동 시점에만 읽히는 값이라 런타임 변경이 안 된다.
    # 그래서 여기(command)에 둔다. 이미 떠 있는 컨테이너에 적용할 때는 데이터를 지키기 위해
    # 재생성 대신 ALTER SYSTEM SET + docker restart 를 쓴다(마운트가 익명 볼륨이라
    # 재생성 시 데이터 보존이 보장되지 않는다).
    #
    # track은 기본값(top, 최상위 문장만)을 쓴다. all은 함수 안에서 실행된 쿼리까지 세는데
    # 이 앱은 저장 프로시저를 쓰지 않아 결과가 같으면서 오버헤드만 는다.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    # /dev/shm 크기. 도커 기본값이 64MB인데 PostgreSQL은 병렬 워커끼리 데이터를 주고받는
    # 동적 공유 메모리(dynamic_shared_memory_type=posix)를 여기에 잡는다. 기본 공유 버퍼
    # (shared_buffers)와는 별개라, 평소에는 멀쩡하다가 병렬 작업에서만 터진다.
    #
    #   ERROR: could not resize shared memory segment "/PostgreSQL.1945457568"
    #          to 67145280 bytes: No space left on device        <- 67,145,280 ≈ 64MB
    #
    # 실제로 board_feedback 1,000만 행에 VACUUM을 돌리다 이 에러를 만났다. 메시지가 디스크를
    # 가리켜서 원인을 찾기 어렵다 — 디스크는 797GB 남아 있었다.
    #
    # VACUUM만의 문제가 아니다. 병렬 쿼리가 켜져 있고(max_parallel_workers_per_gather=2,
    # min_parallel_table_scan_size=8MB) 실제로 Parallel Seq Scan이 도는 것을 측정 중에 확인했다.
    # 해시 조인의 공유 해시 테이블도 여기 들어가므로, 조인 입력이 커지면 어제까지 돌던 쿼리가
    # 갑자기 죽는다.
    #
    # 상한일 뿐이라 실제로 쓰는 만큼만 점유한다(평소 1.1MB 수준).
    shm_size: 1gb
    volumes:
      # 이름 있는 볼륨을 명시한다. 없으면 postgres 이미지의 VOLUME 선언 때문에 익명 볼륨이
      # 붙는데, 그건 이름이 해시라 어느 컨테이너 것인지 알기 어렵고 컨테이너를 갈아끼울 때
      # 딸려 오는지가 보장되지 않는다. 데이터가 걸린 마운트를 운에 맡기지 않는다.
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

