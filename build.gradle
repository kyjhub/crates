plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.crates'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// 퍼센타일 노출용. /actuator/metrics 는 Timer의 count/total/max만 보여주고 퍼센타일은
	// 히스토그램 스냅샷에 있어서 드러나지 않는다. Prometheus 레지스트리를 붙이면
	// /actuator/prometheus 에 ..._seconds{quantile="0.95"} 형태로 나온다.
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'	// OAuth2 클라이언트 기능을 위한 핵심 라이브러리 추가
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'

	// Flyway (DB 마이그레이션 / 1회성 데이터 시딩)
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Java 기반 마이그레이션(V1__SeedBooks)에서 CopyManager/PGConnection을 직접 참조해야 해서
	// runtimeOnly가 아니라 implementation으로 컴파일 클래스패스에 올림
	implementation 'org.postgresql:postgresql'

	// MinIO SDK (이미지 업로드/다운로드용)
	implementation 'io.minio:minio:8.5.7'

	// Qdrant Java Client (벡터 DB 통신용)
	//
	// 서버 버전과 반드시 함께 움직여야 한다(docker-compose.yml의 qdrant 이미지 태그).
	// 1.8.0 클라이언트로 1.17 서버를 부르면 point 조회 응답을 파싱하지 못한다 —
	// 조회 응답 타입이 Vectors/Vector에서 VectorsOutput/VectorOutput으로 갈라졌는데,
	// 옛 클라이언트에는 그 타입 자체가 없어서 dense 데이터가 unknown field로 흘러가고
	// 빈 배열이 돌아온다. 예외가 아니라 빈 값이라 조용히 잘못된 결과가 된다.
	// (search는 id만 읽어서 멀쩡하고 retrieve만 깨지므로 더 늦게 발견된다.)
	implementation 'io.qdrant:client:1.14.1'
	// io.qdrant:client는 grpc-protobuf/guava를 runtime scope로만 선언해서
	// QdrantPointOperations가 직접 참조하는 타입들이 컴파일 클래스패스에 올라오지 않음 → 명시적으로 추가.
	// 버전은 클라이언트가 끌어오는 grpc 1.65.1에 맞춘다.
	implementation 'com.google.protobuf:protobuf-java:3.25.1'   // grpc-protobuf 1.65.1과 동일 버전
	implementation 'com.google.guava:guava:32.1.3-jre'          // grpc가 요구하는 32.1.3의 JVM 판
	implementation 'io.grpc:grpc-api:1.65.1'                    // QdrantConfig가 참조하는 ManagedChannel

	// S3Client 클래스 import
	implementation 'software.amazon.awssdk:s3:2.25.11' // SDK v2

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
}
