plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.crates'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'	// OAuth2 클라이언트 기능을 위한 핵심 라이브러리 추가
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'

	// Flyway (DB 마이그레이션 / 1회성 데이터 시딩)
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Java 기반 마이그레이션(V1__SeedBooks)에서 CopyManager/PGConnection을 직접 참조해야 해서
	// runtimeOnly가 아니라 implementation으로 컴파일 클래스패스에 올림
	implementation 'org.postgresql:postgresql'

	// MinIO SDK (이미지 업로드/다운로드용)
	implementation 'io.minio:minio:8.5.7'

	// Qdrant Java Client (벡터 DB 통신용)
	implementation 'io.qdrant:client:1.8.0'
	// io.qdrant:client는 grpc-protobuf/guava를 runtime scope로만 선언해서
	// QdrantPointOperations가 직접 참조하는 타입들이 컴파일 클래스패스에 올라오지 않음 → 명시적으로 추가
	implementation 'com.google.protobuf:protobuf-java:3.24.0'   // grpc-protobuf 1.59.0과 동일 버전
	implementation 'com.google.guava:guava:30.1-jre'            // io.qdrant:client가 요구하는 버전

	// S3Client 클래스 import
	implementation 'software.amazon.awssdk:s3:2.25.11' // SDK v2

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
}
