# ---------------------------------
jwt:
  secret: ${JWT_SECRET_KEY}
  expiry: 3600000   # 1시간 (ms)
  refresh-expiry: 1209600000  # 14일

app:
  oauth2:
    redirect-uri: https://localhost:3000/auth/callback  # Vite 개발 서버가 basic-ssl로 HTTPS만 서빙하므로 http로 두면 콜백이 끊긴다

scheduler:
  refresh-token-cleanup:
    cron: "0 0 4 * * *"

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# ---------------------------------
# flyway-test 프로필: 스키마 제약과 데이터를 적용하는 실제 개발용 프로필.
#
# 사용법 (엔티티를 바꿨을 때마다 이 순서로 한 번씩):
#   1) 기본 프로필로 실행   -> ddl-auto:create가 테이블을 새로 만들고,
#                             import.sql이 flyway_schema_history를 지운다 (초기화)
#   2) flyway-test로 실행   -> ddl-auto는 손 떼고, Flyway가 V1~V5를 적용한다
#                             V1~V4: 콘텐츠/보드 데이터 시딩
#                             V5:    JPA로 표현 못 하는 제약·인덱스 (docs/board-schema.md)
#
# 평소 개발/테스트는 2)의 상태에서 한다. 1)만 실행한 상태는 데이터도 제약도 없어서
# 화면이 비어 보이고 중복 보드도 걸러지지 않는다.
# ---------------------------------
spring:
  config:
    activate:
      on-profile: flyway-test
  flyway:
    enabled: true
    # Hibernate(ddl-auto:create)가 이미 만들어놓은 스키마에 Flyway가 처음 붙는 상황이라
    # "이력 테이블 없는 non-empty 스키마"로 인식됨 -> baseline 필요.
    # baseline-version은 기본값(1)이면 V1__SeedBooks와 겹쳐서 스킵되므로 0으로 낮춤.
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: none   # Flyway가 방금 채운 데이터를 Hibernate가 건드리지 않도록

# 시딩 중 원본 이미지 URL -> MinIO 업로드 설정.
# 전체 데이터는 book 12만 / movie 4만 / music 190만 건이라 다 받을 이유가 없다.
# API 테스트에 필요한 만큼만 올리고 나머지는 s3_object_key NULL로 남긴다.
seed:
  image-upload:
    limit: 500        # 타입당 업로드 상한. 0이면 업로드를 건너뛰고 시딩만 한다.
    concurrency: 30   # 동시 요청 수. 외부 이미지 서버 차단을 피하려면 과하게 올리지 말 것.
