# ---------------------------------
  # ✅ 5. Elasticsearch (전문 검색 엔진)
# ---------------------------------
#  elasticsearch:
#    uris: http://localhost:9200
    # xpack 보안을 false로 했으므로 username/password 생략

# ---------------------------------
# 로깅 수준 설정
# ---------------------------------
jwt:
  secret: ${JWT_SECRET_KEY}
  expiry: 3600000   # 1시간 (ms)
  refresh-expiry: 1209600000  # 14일

app:
  oauth2:
    redirect-uri: https://localhost:3000/auth/callback  # Vite 개발 서버가 basic-ssl로 HTTPS만 서빙하므로 http로 두면 콜백이 끊긴다

scheduler:
  refresh-token-cleanup:
    cron: "0 0 4 * * *"
  # 밀린 취향 벡터 수를 다시 세는 주기.
  # 게이지 콜백에서 세지 않는 이유는 UserVectorStaleGaugeScheduler 주석 참고 —
  # 스크레이프마다 O(전체 사용자) 쿼리가 도는 것을 막는다.
  # 재계산이 밀렸는지는 분 단위로 알면 충분하다. 기동 직후에는 -1(아직 모름)로 보인다.
  user-vector-stale-gauge:
    fixed-delay: 5m
    initial-delay: 30s
  # 재계산이 유실된 취향 벡터를 뒤늦게 고치는 배치. 근거는 UserVectorBackfillService 주석 참고.
  #
  # grace: 방금 누른 좋아요는 아직 비동기 재계산이 도는 중일 수 있다. 그것까지 밀린 것으로 보면
  #        백필이 진행 중인 작업을 쫓아다니며 같은 계산을 두 번 한다. 재계산 실측이 수십~수백 ms라
  #        5분이면 넉넉하다.
  # batch-size: 크게 망가졌을 때 한 번 돌기 시작한 배치가 몇 시간을 붙잡지 않도록 상한을 둔다.
  #        못 고친 사람은 다음 주기가 이어받는다.
  user-vector-backfill:
    fixed-delay: 10m
    initial-delay: 2m
    grace: 5m
    batch-size: 100

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# ---------------------------------
# init 프로필: 스키마 초기화 전용. **데이터를 전부 지운다.**
#
# ddl-auto:create가 엔티티 기준으로 테이블을 drop/create하고, 그 직후 import.sql이
# flyway_schema_history를 비워 다음 단계(flyway-test)가 V1부터 다시 돌게 한다.
#
# 기본 프로필에 두지 않는 이유는 하나다 — 파괴적인 동작이 기본값이면 언젠가 실수로 실행된다.
# 실제로 프로필을 지정하지 않은 @SpringBootTest 하나가 개발 DB를 통째로 비운 적이 있다.
# 이제는 이름을 직접 적어야만 돈다.
#
#   ./gradlew bootRun --args='--spring.profiles.active=init'
# ---------------------------------
spring:
  config:
    activate:
      on-profile: init
  jpa:
    hibernate:
      ddl-auto: create
  flyway:
    enabled: false

---
# ---------------------------------
# flyway-test 프로필: 스키마 제약과 데이터를 적용하는 실제 개발용 프로필.
#
# 사용법 (엔티티를 바꿨을 때마다 이 순서로 한 번씩):
#   1) init 프로필로 실행   -> ddl-auto:create가 테이블을 새로 만들고,
#                             import.sql이 flyway_schema_history를 지운다 (초기화)
#   2) flyway-test로 실행   -> ddl-auto는 손 떼고, Flyway가 V1~V5를 적용한다
#                             V1~V4: 콘텐츠/보드 데이터 시딩
#                             V5:    JPA로 표현 못 하는 제약·인덱스 (docs/board-schema.md)
#
# 평소 개발/테스트는 2)의 상태에서 한다. 1)만 실행한 상태는 데이터도 제약도 없어서
# 화면이 비어 보이고 중복 보드도 걸러지지 않는다.
# ---------------------------------
spring:
  config:
    activate:
      on-profile: flyway-test
  flyway:
    enabled: true
    # Hibernate(ddl-auto:create)가 이미 만들어놓은 스키마에 Flyway가 처음 붙는 상황이라
    # "이력 테이블 없는 non-empty 스키마"로 인식됨 -> baseline 필요.
    # baseline-version은 기본값(1)이면 V1__SeedBooks와 겹쳐서 스킵되므로 0으로 낮춤.
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: none   # Flyway가 방금 채운 데이터를 Hibernate가 건드리지 않도록

# 시딩 중 원본 이미지 URL -> MinIO 업로드 설정.
# 전체 데이터는 book 12만 / movie 4만 / music 190만 건이라 다 받을 이유가 없다.
# API 테스트에 필요한 만큼만 올리고 나머지는 s3_object_key NULL로 남긴다.
#
# 상한을 500에서 10000으로 올린 이유: 추천 보드가 Qdrant 벡터 유사도로 콘텐츠를 뽑는데,
# 이미지가 있는 콘텐츠가 1,373건뿐(전체의 0.7%)이라 추천 결과가 거의 다 포스터 없이 나왔다.
# PRE_MADE 보드는 s3object_key IS NOT NULL로 골라 담아서 이 문제가 드러나지 않았다.
seed:
  image-upload:
    limit: 10000      # 타입당 업로드 상한. 0이면 업로드를 건너뛰고 시딩만 한다.
    concurrency: 30   # 동시 요청 수. 외부 이미지 서버 차단을 피하려면 과하게 올리지 말 것.
