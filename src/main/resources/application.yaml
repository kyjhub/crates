spring:
  # ✅ 1. PostgreSQL 연결 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/crates
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create # 매번 빈 DB에서 시작하므로 테이블 재생성 후 import.sql 실행
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        hbm2ddl:
          # import.sql의 기본 파서는 "한 줄 = 한 문장"이라, 여러 줄로 쓴 DDL이 줄 단위로 쪼개져
          # 전부 구문 오류가 난다. halt_on_error가 기본 false여서 로그만 남기고 그냥 뜨기 때문에
          # 제약이 하나도 안 걸린 채 돌아간다(실제로 fk_feedback_user의 ON DELETE SET NULL이
          # 이렇게 조용히 누락돼 있었다). 여러 줄 문장을 읽는 파서로 교체한다.
          import_files_sql_extractor: org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor
    show-sql: true  # 콘솔에 쿼리 출력 여부
  # ✅ Flyway: 기본 프로필에서는 비활성화.
  #
  # 두 프로필이 역할을 나눠 갖는다. 한 번에 둘 다 켤 수 없는 이유는, Spring Boot가 Flyway를
  # EntityManagerFactory보다 먼저 실행해서 [Flyway 시딩] -> [ddl-auto가 drop/create]
  # 순서가 되어 시딩한 데이터가 곧바로 지워지기 때문이다.
  #
  #   1) 기본 프로필   : 초기화 전용. ddl-auto:create가 엔티티 기준으로 테이블을 새로 만들고,
  #                     import.sql이 flyway_schema_history를 지워 다음 단계가 처음부터 돌게 한다.
  #   2) flyway-test  : 스키마 제약(V5) + 데이터(V1~V4)를 적용한다. ddl-auto는 none이라
  #                     1)에서 만든 테이블을 그대로 쓴다.
  #
  # 엔티티를 바꿨으면 1) -> 2) 순서로 한 번씩 실행한다.
  flyway:
    enabled: false
  # ✅ 2. Redis (추천 보드 캐싱용)
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/naver
        provider:
          # 구글은 스프링이 기본 설정을 제공하지만, 카카오/네이버는 한국 서비스라 아래처럼 제공자 설정을 수동으로 채워줘야 합니다.
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response



# reids, elasticSearch 아직 docker에 없어서 발생하는 에러 생략
management:
  health:
    redis:
      enabled: true
    elasticsearch:
      enabled: false


# ✅ 4. Qdrant 연결 설정 (커스텀 설정)
ai:
  vectorstore:
    qdrant:
      host: localhost
      port: 6333
      grpc-port: 6334
      api-key: "" # 로컬 도커는 인증이 없으므로 빈 문자열
      content-collection-name: content_vector
      query-collection-name: query_vector
      # 애플리케이션 시작 시 RDB의 content.id에 대응하는 로컬 테스트용 더미 벡터를 생성한다.
      seed:
        enabled: true
        dimension: 768
        batch-size: 256
        # 관계형 DB를 초기화하면 content.id가 1부터 다시 부여되는데 Qdrant는 그 사실을 모른다.
        # 이전 실행의 point가 남아 있으면 시더가 전부 "이미 있음"으로 건너뛰어, 새 콘텐츠에
        # 옛 벡터가 매달린 채 조용히 잘못된 추천이 나간다. 그래서 시딩 전에 컬렉션을 갈아엎는다.
        # 실제 임베딩을 적재하기 시작하면 반드시 false로 되돌릴 것.
        recreate: true
        # 같은 content_id에는 재실행해도 동일한 float32 벡터가 생성된다.
        random-seed: 20260830
  server:
    base-url: http://100.77.133.40:8000  # AI 서버(Tailscale IP). 로컬 단독 테스트 시 http://localhost:8000
    embedding-path: /api/v1/search/vector  # AI 서버가 백엔드용으로 만든 계약: {"text": "..."} -> {"vector": [...]}
    connect-timeout: 2000
    read-timeout: 3000
    embedding-dimension: 768   # AI 서버가 반환하는 벡터 차원 (float32 x 768)
    # AI 서버와 아직 통신할 수 없어서, 검색어 임베딩을 로컬에서 대신 만든다.
    # true면 StubEmbeddingClient가, false면 실제 호출용 AiEmbeddingClient가 빈으로 등록된다.
    # 통신이 열리면 enabled만 false로 되돌리면 되고 나머지 코드는 그대로다.
    stub:
      enabled: true
      # 같은 검색어에는 재실행해도 항상 같은 벡터가 나온다.
      # 콘텐츠 시딩 seed와는 별개 값이라 두 벡터 공간이 서로 얽히지 않는다.
      random-seed: 20260902

