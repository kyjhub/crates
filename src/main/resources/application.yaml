# ---------------------------------
# 로깅 수준 설정
# ---------------------------------
logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG         # 쿼리 로그 보기
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE # 쿼리에 들어가는 파라미터 값(?) 보기