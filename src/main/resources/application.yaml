  # ✅ 5. Elasticsearch (전문 검색 엔진)
# ---------------------------------
#  elasticsearch:
#    uris: http://localhost:9200
    # xpack 보안을 false로 했으므로 username/password 생략

# ---------------------------------
# 로깅 수준 설정
# ---------------------------------
jwt:
  secret: ${JWT_SECRET_KEY}
  expiry: 3600000   # 1시간 (ms)
  refresh-expiry: 1209600000  # 14일

app:
  oauth2:
    redirect-uri: https://localhost:3000/auth/callback  # Vite 개발 서버가 basic-ssl로 HTTPS만 서빙하므로 http로 두면 콜백이 끊긴다

# 시딩 중 원본 이미지 URL -> MinIO 업로드 설정.
# 전체 데이터는 book 12만 / movie 4만 / music 190만 건이라 다 받을 이유가 없다.
# API 테스트에 필요한 만큼만 올리고 나머지는 s3object_key NULL로 남긴다.
#
# 상한을 500에서 10000으로 올린 이유: 추천 보드가 Qdrant 벡터 유사도로 콘텐츠를 뽑는데,
# 이미지가 있는 콘텐츠가 1,373건뿐(전체의 0.7%)이라 추천 결과가 거의 다 포스터 없이 나왔다.
# PRE_MADE 보드는 s3object_key IS NOT NULL로 골라 담아서 이 문제가 드러나지 않았다.
#
# 0으로 두면 업로드를 건너뛰고 시딩만 한다(코드 기본값도 0이다).
# 이미지 없이 빠르게 스키마·데이터만 확인하고 싶을 때 쓴다 — 대신 보드가 전부 포스터 없이 뜬다.
seed:
  image-upload:
    limit: 10000      # 타입당 업로드 상한
    concurrency: 30   # 동시 요청 수. 외부 이미지 서버 차단을 피하려면 과하게 올리지 말 것.

scheduler:
  refresh-token-cleanup:
    cron: "0 0 4 * * *"

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

